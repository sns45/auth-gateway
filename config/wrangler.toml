# Reference deployment: in8.sh. The gateway itself is domain-agnostic; to run
# your own, copy the template at the repo root (wrangler.toml), point the
# route/vars at your zone, and set the secrets listed below. Nothing in src/
# knows about in8.sh: cookie domain and frontend origin are derived from the
# request hostname (override with COOKIE_DOMAIN / FRONTEND_URL).
name = "in8-auth-gateway"
main = "../dist/index.js"
compatibility_date = "2024-10-21"
compatibility_flags = ["nodejs_compat"]

# Sessions. D1 is strongly consistent, so a revoked session cannot keep
# authenticating from another colo. Provision before deploying:
#   wrangler d1 create in8-auth-sessions --config config/wrangler.toml
#   wrangler d1 migrations apply in8-auth-sessions --remote --config config/wrangler.toml
[[d1_databases]]
binding = "AUTH_DB"
database_name = "in8-auth-sessions"
database_id = "32ee5de4-75b2-4b6f-9a78-f012b538cb7a"

migrations_dir = "../migrations"

# No Durable Object is declared here, and none should be added. A Durable
# Object requires Workers Paid, and this deployment runs on the free plan. Live
# session sync used to be one per user, pushing an invalidation to that user's
# open tabs; clients re-read get-session on a timer instead. D1 remains the
# authority, so revocation is still immediate for anything that asks.

# KV: rate limit counters only. Not sessions - KV's eventual consistency is
# incompatible with immediate revocation. OAuth state is Better Auth's now.
[[kv_namespaces]]
binding = "AUTH_STORE"
id = "3557a29a2c894326bd3422bfb9ae4e51"
preview_id = "8c6d2c8b5d8f4e5486976b98d6765b1a"

# Production variables. The GOOGLE_CLIENT_ID is a public identifier by design
# (it appears in every OAuth redirect); secrets stay in Doppler / wrangler
# secrets: BETTER_AUTH_SECRET, GOOGLE_CLIENT_SECRET.
[vars]
NODE_ENV = "production"
ALLOWED_ORIGINS = "https://in8.sh,https://www.in8.sh,https://auth.in8.sh"
LOG_LEVEL = "info"
GOOGLE_CLIENT_ID = "428616692025-tmncbvvk4k6lob3q185el3dv88v0i0j8.apps.googleusercontent.com"
OAUTH_BASE_URL = "https://auth.in8.sh"
FRONTEND_URL = "https://in8.sh"
# Session cookies must be readable by every site the gateway signs in, not just
# by the gateway itself. Without this, Better Auth falls back to the baseURL
# host (auth.in8.sh), and in8.sh never receives the cookie on its own requests.
COOKIE_DOMAIN = ".in8.sh"

# Custom domain route on the in8.sh zone
[[routes]]
pattern = "auth.in8.sh/*"
zone_name = "in8.sh"
