name = "auth-gateway"
main = "dist/index.js"
compatibility_date = "2024-10-21"
compatibility_flags = ["nodejs_compat"]

# Sessions. D1 is strongly consistent, so a revoked session cannot keep
# authenticating from another colo. Create with:
#   wrangler d1 create auth-gateway-sessions
#   wrangler d1 migrations apply auth-gateway-sessions --remote
[[d1_databases]]
binding = "AUTH_DB"
database_name = "auth-gateway-sessions"
database_id = ""

migrations_dir = "migrations"

# Live session sync. One Durable Object per user fans a session change out to
# that user's open tabs on every device. SQLite backed because that is the
# variant available on the Workers Free plan; the legacy KV backed one is not.
[[durable_objects.bindings]]
name = "SESSION_HUB"
class_name = "SessionHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionHub"]

# KV: rate limit counters only. Not sessions - KV's eventual consistency is
# incompatible with immediate revocation. OAuth state is Better Auth's now.
[[kv_namespaces]]
binding = "AUTH_STORE"
id = ""
preview_id = ""

# Default variables (used in development)
[vars]
NODE_ENV = "development"
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:8787,https://example.com,https://staging.example.com,https://auth.example.com,https://auth-staging.example.com"
LOG_LEVEL = "debug"
GOOGLE_CLIENT_ID = "1222222345678999999-xxxxxxxxxxxxxxxxxx.apps.googleusercontent.com"
OAUTH_BASE_URL = "http://localhost:8787"
FRONTEND_URL = "http://localhost:5173"

# Single worker with custom domains
[[routes]]
pattern = "auth.example.com/*"
zone_name = "example.com"

[[routes]]
pattern = "auth-staging.example.com/*"
zone_name = "example.com"

# Environment-specific variables will be set at runtime
# NODE_ENV is determined by the request hostname:
# - auth.example.com -> production (OAUTH_BASE_URL: https://auth.example.com)
# - auth-staging.example.com -> staging (OAUTH_BASE_URL: https://auth-staging.example.com)
# - localhost:* -> development (OAUTH_BASE_URL: http://localhost:8787)
# 
# NOTE: OAUTH_BASE_URL ensures OAuth callbacks go through the gateway 
# instead of directly to Convex (which would cause 500 errors)

# Secrets (set via wrangler secret put or Doppler)
# BETTER_AUTH_SECRET
# GOOGLE_CLIENT_SECRET

# Build step handled separately
# [build]
# command = "npm run build"

# Staging environment - uses same worker name, different vars
[env.staging]
[[env.staging.d1_databases]]
binding = "AUTH_DB"
database_name = "auth-gateway-sessions-staging"
database_id = ""

[[env.staging.durable_objects.bindings]]
name = "SESSION_HUB"
class_name = "SessionHub"

[[env.staging.kv_namespaces]]
binding = "AUTH_STORE"
id = "c"
preview_id = ""

[env.staging.vars]
NODE_ENV = "production"
OAUTH_BASE_URL = "https://auth-staging.example.com"
FRONTEND_URL = "https://staging.example.com"
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:8787,https://example.com,https://staging.example.com,https://auth.example.com,https://auth-staging.example.com"
LOG_LEVEL = "debug"
GOOGLE_CLIENT_ID = "-.apps.googleusercontent.com"

# Production environment - uses same worker name, different vars  
[env.production]
[[env.production.d1_databases]]
binding = "AUTH_DB"
database_name = "auth-gateway-sessions"
database_id = ""

[[env.production.durable_objects.bindings]]
name = "SESSION_HUB"
class_name = "SessionHub"

[[env.production.kv_namespaces]]
binding = "AUTH_STORE"
id = "c"
preview_id = ""

[env.production.vars]
NODE_ENV = "production"
OAUTH_BASE_URL = "https://auth.example.com"
FRONTEND_URL = "https://example.com"
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:8787,https://example.com,https://staging.example.com,https://auth.example.com,https://auth-staging.example.com"
LOG_LEVEL = "info"
GOOGLE_CLIENT_ID = "c-.apps.googleusercontent.com"